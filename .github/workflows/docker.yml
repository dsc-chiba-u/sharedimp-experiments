name: Docker images

# Builds the two images this repository needs beyond the package images and
# publishes them to
#   ghcr.io/dsc-chiba-u/<name>   and, if the Docker Hub secrets exist,   docker.io/koki/<name>
#     sharedimp-experiments-r   docker/experiments-r    (sharedimp-r + deps of the official UMFI R package + plotting)
#     umfi-official-py          docker/umfi-official-py (deps of the official Python UMFI code; the code is NOT included)
#
# * Pull requests: build only (each Dockerfile ends with its own import check).
# * Push to main touching docker/ or this file, or a manual run: build, then
#   push `latest` and the short commit SHA.
#
# The workflows of this repository use the images by digest
# (config/pins.env), so pushing a new image changes nothing until the pin is
# updated.

on:
  push:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker.yml"]
  pull_request:
    branches: [main]
    paths: ["docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_METADATA_SHORT_SHA_LENGTH: 7

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sharedimp-experiments-r
            context: docker/experiments-r
          - name: umfi-official-py
            context: docker/umfi-official-py
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Docker Hub is optional: without the two secrets the image still goes
      # to GHCR and the run says so.
      - name: Registries
        id: reg
        run: |
          images="ghcr.io/dsc-chiba-u/${{ matrix.name }}"
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            images="$images"$'\n'"docker.io/koki/${{ matrix.name }}"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Docker Hub skipped::Repository secrets DOCKER_USERNAME / DOCKER_PASSWORD are not set; the image is pushed to GHCR only."
          fi
          { echo "images<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.reg.outputs.images }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true' && steps.reg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The Dockerfile's last RUN loads every package, so a successful build
      # is a tested build. One build, one push, one digest in every registry.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.name }}"
            if [ "$PUBLISH" = "true" ] && [ -n "$DIGEST" ]; then
              echo "Published, digest: \`$DIGEST\`"
              echo '```'
              echo "$TAGS"
              echo '```'
            elif [ "$PUBLISH" = "true" ]; then
              echo "Not published (a step failed; see the log)"
            else
              echo "Build only (nothing was pushed)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
