# Workflow driver only: Snakemake and Singularity.
#
# R, Python and the two `sharedimp` packages are NOT installed on the host.
# Every computation runs inside a container image referenced by digest in
# config/pins.env (see workflow/common.smk).
#
#   conda env create -f environment.yml
#   conda activate snakemake
#   bash scripts/01_environment.sh
#
# The versions below are the ones that produced the committed results
# (recorded in results/raw/01_environment/host.json).
name: snakemake
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - snakemake=8.10.0
  - singularity=3.8.6
  - graphviz
